<script>/* Fallback de dessin Canvas 2D pour ouvrir le HTML sans connexion. Le sketch.js
   reste du vrai code p5.js lorsqu'il est exécuté dans l'éditeur p5.js. */
if (!window.p5) {
  (function () {
    const c = {el:null,ctx:null,fill:'#101510',stroke:'#101510',hasFill:true,hasStroke:true,
      lineWidth:1,fontSize:11,fontFamily:'monospace',align:'center',baseline:'middle',rectMode:'corner'};
    window.width=0;window.height=0;window.mouseX=-500;window.mouseY=-500;
    window.deltaTime=16.67;window.frameCount=0;
    window.PI=Math.PI;window.CENTER='center';window.CORNER='corner';window.NORMAL='normal';
    window.sin=Math.sin;window.cos=Math.cos;
    const start=performance.now(); window.millis=()=>performance.now()-start;
    function setCtxStyle(){
      if(!c.ctx)return;
      c.ctx.font=c.fontSize+'px '+c.fontFamily;
      c.ctx.textAlign=c.align;
      c.ctx.textBaseline=c.baseline;
      c.ctx.lineWidth=c.lineWidth;
      c.ctx.strokeStyle=c.stroke;
      c.ctx.fillStyle=c.fill;
    }
    function cssColor(arr){
      if(arr.length===1&&typeof arr[0]==='string')return arr[0];
      if(arr.length===1&&typeof arr[0]==='number')return `rgb(${arr[0]},${arr[0]},${arr[0]})`;
      if(arr.length>=3)return `rgba(${arr[0]},${arr[1]},${arr[2]},${(arr[3]??255)/255})`;
      return '#111';
    }
    window.createCanvas=(w,h)=>{
      window.width=w;window.height=h;
      c.el=document.createElement('canvas');c.el.width=w;c.el.height=h;
      c.ctx=c.el.getContext('2d');window.drawingContext=c.ctx;setCtxStyle();
      let down=false;
      function relative(ev){const rect=c.el.getBoundingClientRect();window.mouseX=(ev.clientX-rect.left)*(width/rect.width);window.mouseY=(ev.clientY-rect.top)*(height/rect.height);}
      c.el.addEventListener('pointerdown',ev=>{relative(ev);down=true;c.el.setPointerCapture(ev.pointerId);if(window.mousePressed)window.mousePressed();});
      c.el.addEventListener('pointermove',ev=>{relative(ev);if(down&&window.mouseDragged)window.mouseDragged();});
      c.el.addEventListener('pointerup',ev=>{relative(ev);down=false;if(window.mouseReleased)window.mouseReleased();});
      c.el.addEventListener('pointercancel',()=>{down=false;if(window.mouseReleased)window.mouseReleased();});
      return {elt:c.el,parent(id){document.getElementById(id).appendChild(c.el)}};
    };
    window.resizeCanvas=(w,h)=>{window.width=w;window.height=h;c.el.width=w;c.el.height=h;setCtxStyle();};
    window.pixelDensity=()=>{};
    window.background=(...a)=>{c.ctx.save();c.ctx.setTransform(1,0,0,1,0,0);c.ctx.fillStyle=cssColor(a);c.ctx.fillRect(0,0,width,height);c.ctx.restore();};
    window.push=()=>c.ctx.save();window.pop=()=>c.ctx.restore();
    window.translate=(x,y)=>c.ctx.translate(x,y);window.scale=(v)=>c.ctx.scale(v,v);window.rotate=(v)=>c.ctx.rotate(v);
    window.fill=(...a)=>{c.fill=cssColor(a);c.ctx.fillStyle=c.fill;c.hasFill=true;};
    window.stroke=(...a)=>{c.stroke=cssColor(a);c.ctx.strokeStyle=c.stroke;c.hasStroke=true;};
    window.noStroke=()=>{c.hasStroke=false;};window.noFill=()=>{c.hasFill=false;};
    window.strokeWeight=(v)=>{c.lineWidth=v;c.ctx.lineWidth=v;};
    window.rectMode=(m)=>{c.rectMode=m;};
    window.rect=(x,y,w,h)=>{
      h=h??w;if(c.rectMode===window.CENTER){x-=w/2;y-=h/2;}
      if(c.hasFill)c.ctx.fillRect(x,y,w,h);if(c.hasStroke)c.ctx.strokeRect(x,y,w,h);
    };
    window.circle=(x,y,d)=>{c.ctx.beginPath();c.ctx.arc(x,y,d/2,0,Math.PI*2);if(c.hasFill)c.ctx.fill();if(c.hasStroke)c.ctx.stroke();};
    window.line=(x1,y1,x2,y2)=>{if(!c.hasStroke)return;c.ctx.beginPath();c.ctx.moveTo(x1,y1);c.ctx.lineTo(x2,y2);c.ctx.stroke();};
    window.textFont=(name)=>{c.fontFamily=name;setCtxStyle();};
    window.textSize=(size)=>{c.fontSize=size;setCtxStyle();};
    window.textStyle=()=>{};
    window.textAlign=(a,b)=>{c.align=a==='center'?'center':a==='left'?'left':'right';c.baseline=b==='center'?'middle':'alphabetic';setCtxStyle();};
    window.text=(str,x,y)=>{if(c.hasFill)c.ctx.fillText(String(str),x,y);if(c.hasStroke)c.ctx.strokeText(String(str),x,y);};
    window.textWidth=(str)=>c.ctx.measureText(String(str)).width;
    window.saveCanvas=(canvas,filename,extension)=>{
      const anchor=document.createElement('a');anchor.href=c.el.toDataURL('image/png');anchor.download=filename+'.png';anchor.click();
    };
    window.addEventListener('resize',()=>{if(window.windowResized)window.windowResized();});
    window.addEventListener('load',()=>{
      if(!window.setup||!window.draw)return;
      window.setup();let last=performance.now();
      function tick(now){window.deltaTime=Math.min(100,now-last);last=now;
        window.frameCount++;c.rectMode='corner';c.hasFill=true;c.hasStroke=true;
        setCtxStyle();window.draw();requestAnimationFrame(tick);}
      requestAnimationFrame(tick);
    });
  })();
}
</script>

<script>
/*
 LE MÉTABOLISME PLANÉTAIRE DE L'INTELLIGENCE ARTIFICIELLE // CHILE_FRANCE
 Cartographie collective en deux moments (p5.js, mode global)

 JOUR 01 : constellation libre de noms et mots provisoires, sans liens.
 JOUR 02 : graphe constitué uniquement à partir des fiches saisies.
   ···  ligne pointillée = recherches (personne -> objet étudié)
   ───  ligne continue  = interdépendances (objets / territoires)

 Un objet principal par fiche. Séparer plusieurs dépendances, transformations
 ou territoires par des POINTS-VIRGULES. Les objets identiques sont fusionnés
 automatiquement; les synonymes se consolident via « Harmoniser un nœud ».

 Pas de serveur : l'enregistrement se fait dans ce navigateur. Exporter en JSON
 à la fin de chaque journée et réimporter le fichier pour continuer.
*/

const PEOPLE = [
  "Romain Badouard", "Alberto Coddou Mc Manus", "Juana Torres Cierpe",
  "Rodolfo Martinic Lenta", "Andrés Navas", "Frédéric Hérau",
  "Laurent Bienvenu", "Joaquín Fontbona", "Julie Marques",
  "Zoé Aegerter", "Emmanuel Ducourneau", "Manuela Garretón",
  "Nicolás Díaz Bejarano", "Emma Dorval", "Solène Rey-Coquais",
  "Héctor Morales", "Nicolas Richard"
];
const START_WORDS = [
  "EAU", "ÉNERGIE", "MINÉRAUX", "SOLS", "TRAVAIL", "ALGORITHMES",
  "CALCUL", "DONNÉES", "CENTRES DE DONNÉES", "CÂBLES SOUS-MARINS",
  "TERRITOIRES", "RÉGULATION", "MODÈLES D’IA", "PLATEFORMES",
  "CHALEUR", "EXTRACTION", "MAINTENANCE", "JUSTICE", "ROBOTIQUE"
];
const STORAGE_KEY = "metabolisme-chile-france-deux-jours-v1";
const BG = "#003BFF";
const BLACK = "#FFFFFF";

let phase = 1;
let responses = [];
let extraConcepts = [];
let extraLinks = [];
let editingId = null;
let graph = {nodes:[], edges:[]};
let graphPositions = new Map();
let constellations = [];
let lastPhaseChange = 0;
let draggingId = null;
let selectedId = null;
let hoveredId = null;
let graphShowResearch = true;
let graphShowInterdep = true;
let motion = 0.7;
let zoom = 1;
let startedDemo = false;
let stageEl;
let currentCanvas;

const hash = (str) => {
  let h = 2166136261;
  for (const ch of String(str)) {h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619);}
  return h >>> 0;
};
const unit = (s) => (hash(s) % 100000) / 100000;
const clean = (s) => String(s || "").trim().replace(/\s+/g, " ");
const keyOf = (s) => clean(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[’']/g,"'").toLowerCase();
const splitTags = (s) => [...new Map(String(s || "").split(";").map(clean).filter(Boolean).map(x => [keyOf(x),x])).values()];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
const uid = () => "r" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const personId = (s) => "p:" + keyOf(s);
const conceptId = (s) => "c:" + keyOf(s);
const $ = (id) => document.getElementById(id);

function setup() {
  buildInterface();
  restoreLocal();
  stageEl = $("viz");
  currentCanvas = createCanvas(Math.max(320,stageEl.clientWidth), Math.max(400,stageEl.clientHeight));
  currentCanvas.parent("viz");
  currentCanvas.elt.setAttribute("aria-label", "Cartographie animée des recherches et des interdépendances");
  currentCanvas.elt.style.touchAction = "none";
  pixelDensity(1);
  textFont("monospace");
  initConstellation();
  rebuildGraph();
  renderAll();
  lastPhaseChange = millis();
}

function buildInterface() {

  st.textContent = `

    textarea{resize:vertical;min-height:48px} input[type=range]{width:100%;accent-color:#131913}
    .btn{border:1px solid #202820;background:#fff;border-radius:5px;padding:9px 11px;font-size:12px;text-align:center}
    .btn:hover{background:#ecefe8}.btn.dark{background:#182218;color:#fff}.btn.dark:hover{background:#384438}
    .btn.slim{padding:5px 8px;font-size:11px}.btn.line{border-color:#cdd2c9}.btn.danger{color:#a31a16;border-color:#d9b8b6}
    .btnrow{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.btnrow>*{flex:1}
    .counter{font:11px monospace;color:#505c52;margin:5px 0 10px}
    .card{padding:10px 9px;margin:8px 0;background:#fff;border:1px solid #dadfd8;border-radius:6px}
    .card strong{font-size:12px}.card p{font-size:11.5px;line-height:1.42;margin:5px 0;color:#384339}
    .card .sub{color:#6a746b;font-size:11px}
    .list{max-height:310px;overflow:auto} .small-line{display:flex;gap:7px;align-items:center;margin:6px 0;justify-content:space-between;font-size:11.5px}
    .scroll-select{max-height:135px;overflow:auto} .check{display:flex;align-items:center;gap:7px;margin:8px 0;font-size:11px}
    .check input{accent-color:#161b17}.control-row{display:grid;grid-template-columns:1fr 60px;gap:8px;align-items:center}
    .status{font:10px monospace;color:#687768;margin:8px 0}
    .tag{display:inline-block;border:1px solid #d5dcd3;border-radius:3px;padding:2px 5px;font:10px monospace;margin:3px 3px 0 0}

    @media(max-width:1000px){#met-app{grid-template-columns:1fr}#sidebar{max-height:none;border-top:1px solid #ccd2ca;border-left:0}#stage-shell{min-height:530px;height:68vh;flex:none}}
    @media(max-width:580px){#masthead{display:block} .location{text-align:left;margin-top:10px}#stage-shell{min-height:490px;height:63vh}#stage-note{max-width:85%;font-size:9px}#stage-tips{display:none}}
  `;
  document.head.appendChild(st);
  const root = document.createElement("div");
  root.id = "met-app";
  root.innerHTML = `

function saveResponse(){
  const who = clean($("who").value), object = clean($("object").value);
  if(!object){$("formNotice").textContent = "Précisez un objet de recherche.";$("object").focus();return;}
  const entry = { id:editingId || uid(), author:who, object,
    depends:splitTags($("depends").value), transforms:splitTags($("transforms").value),
    territories:splitTags($("territories").value), demo:false };
  const i = responses.findIndex(r=>r.id===entry.id);
  if(i>=0)responses[i]=entry;else responses.push(entry);
  clearForm(); $("formNotice").textContent = "Contribution enregistrée. Passez au jour 02 pour voir les liens.";
  changed();
}
function clearForm(){
  editingId=null;["object","depends","transforms","territories"].forEach(k=>$(k).value="");
  $("saveResponse").textContent="Ajouter la contribution";$("cancelEdit").style.display="none";
}
function responseAction(e){
  const btn=e.target.closest("button[data-action]");if(!btn)return;
  const entry=responses.find(r=>r.id===btn.dataset.id);if(!entry)return;
  if(btn.dataset.action==="edit"){
    editingId=entry.id;

function conceptNames(){

      if(clean(word)&&!found.has(keyOf(word)))found.set(keyOf(word),clean(word));
    }
  }
  for(const word of extraConcepts){if(!found.has(keyOf(word)))found.set(keyOf(word),word);}
  return [...found.values()].sort((a,b)=>a.localeCompare(b,"fr"));
}
function renameConcept(oldName,newName){
  newName=clean(newName);if(!newName||keyOf(newName)===keyOf(oldName)&&newName===oldName)return;
  const replacement=s=>keyOf(s)===keyOf(oldName)?newName:s;
  responses=responses.map(r=>({...r,object:replacement(r.object),
    depends:distinct(r.depends.map(replacement)),transforms:distinct(r.transforms.map(replacement)),
    territories:distinct(r.territories.map(replacement))}));
  extraConcepts=distinct(extraConcepts.map(replacement));
  extraLinks=extraLinks.map(e=>({...e,a:replacement(e.a),b:replacement(e.b)}))
                       .filter(e=>keyOf(e.a)!==keyOf(e.b));

}

function buildGraph(){
  const nodes=new Map(), edges=new Map();
  function addPerson(name){
    const id=personId(name);if(!nodes.has(id))nodes.set(id,{id,label:name,type:"person"});return id;
  }
  function addConcept(name,territorial=false){
    const id=conceptId(name);if(!nodes.has(id))nodes.set(id,{id,label:clean(name),type:territorial?"territory":"concept"});
    else if(!territorial)nodes.get(id).type="concept";
    return id;
  }
  function addEdge(a,b,type,verb,source){
    if(a===b)return;
    const id=type+"|"+a+"|"+b+"|"+keyOf(verb);
    if(!edges.has(id))edges.set(id,{id,a,b,type,verb,sources:[source]});
    else if(!edges.get(id).sources.includes(source))edges.get(id).sources.push(source);
  }
  PEOPLE.forEach(addPerson);
  for(const r of responses){
    const a=addPerson(r.author),o=addConcept(r.object);
    addEdge(a,o,"research","étudie",r.id);
    for(const d of r.depends)addEdge(o,addConcept(d),"interdependency","dépend de",r.id);
    for(const t of r.transforms)addEdge(o,addConcept(t),"interdependency","transforme",r.id);
    for(const territory of r.territories)addEdge(o,addConcept(territory,true),"interdependency","est situé à / agit à l’échelle de",r.id);
  }
  for(const x of extraConcepts)addConcept(x);
  for(const e of extraLinks)addEdge(addConcept(e.a),addConcept(e.b),"interdependency",e.verb,e.id);
  return {nodes:[...nodes.values()], edges:[...edges.values()]};
}
function rebuildGraph(){
  const next=buildGraph();
  for(const n of next.nodes){
    const previous=graphPositions.get(n.id)||graph.nodes.find(x=>x.id===n.id);
    const init = constellations.find(x=>keyOf(x.label)===keyOf(n.label));
    const initX=init?init.x:width/2+(unit(n.id+"x")-.5)*Math.min(width*.65,520);
    const initY=init?init.y:height/2+(unit(n.id+"y")-.5)*Math.min(height*.65,350);
    n.x=previous?.x ?? initX;n.y=previous?.y ?? initY;n.vx=previous?.vx??0;n.vy=previous?.vy??0;
    n.seed=unit(n.id)*30;
  }
  graph=next;graphPositions=new Map(graph.nodes.map(x=>[x.id,x]));
  if(selectedId&&!graphPositions.has(selectedId))selectedId=null;
  updateSelection();
}
function initConstellation(){
  const labels=[...PEOPLE.map(label=>({label,type:"person"})),...START_WORDS.map(label=>({label,type:"word"}))];
  const created=[];
  for(const [i,item] of labels.entries()){
    let x=0,y=0;
    for(let attempt=0;attempt<70;attempt++){
      const u=unit(item.label+"x"+attempt),v=unit(item.label+"y"+attempt);
      x=width*(.09+.82*u);y=height*(.10+.80*v);
      if(created.every(p=>Math.abs(p.baseX-x)>(p.label.length+item.label.length)*3.45+7 || Math.abs(p.baseY-y)>25))break;
    }
    created.push({...item,baseX:x,baseY:y,x,y,seed:unit(item.label+"phase")*6.283,
      amplitude:12+unit(item.label+"amp")*26,
      speed:.55+unit(item.label+"speed")*.55});
  }
  constellations=created;
}

function updateConstellation(){

  }
}

function updateGraph(){
  if(motion===0 || draggingId && graph.nodes.length===0)return;
  const nodes=graph.nodes, edges=graph.edges;
  const dt=Math.min(1.4,Math.max(.35,deltaTime/16.67))*motion;
  const forces=new Map(nodes.map(n=>[n.id,{x:0,y:0}]));
  for(let i=0;i<nodes.length;i++){
    const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){
      const b=nodes[j],dx=b.x-a.x,dy=b.y-a.y,dist2=dx*dx+dy*dy+200;
      const dist=Math.sqrt(dist2),repel=2950/dist2;
      const fx=repel*dx/dist,fy=repel*dy/dist;
      forces.get(a.id).x-=fx;forces.get(a.id).y-=fy;
      forces.get(b.id).x+=fx;forces.get(b.id).y+=fy;
      // Évite que les étiquettes se recouvrent, même dans un réseau dense.
      const safeX=(a.label.length+b.label.length)*3.25+9;
      const safeY=25;
      if(Math.abs(dx)<safeX && Math.abs(dy)<safeY){
        const sx=dx===0?(unit(a.id+b.id)>.5?1:-1):Math.sign(dx);
        const sy=dy===0?(unit(b.id+a.id)>.5?1:-1):Math.sign(dy);
        const pushX=(safeX-Math.abs(dx))*.015;
        const pushY=(safeY-Math.abs(dy))*.023;
        forces.get(a.id).x-=sx*pushX;forces.get(b.id).x+=sx*pushX;
        forces.get(a.id).y-=sy*pushY;forces.get(b.id).y+=sy*pushY;
      }
    }
  }
  for(const e of edges){
    const a=graphPositions.get(e.a),b=graphPositions.get(e.b);
    if(!a||!b)continue;
    const dx=b.x-a.x,dy=b.y-a.y,dist=Math.max(1,Math.hypot(dx,dy));
    const spring=(dist-(e.type==="research"?134:117))*.0026;
    const fx=spring*dx/dist,fy=spring*dy/dist;
    forces.get(a.id).x+=fx;forces.get(a.id).y+=fy;
    forces.get(b.id).x-=fx;forces.get(b.id).y-=fy;
  }
  const t=millis()/1000;
  for(const n of nodes){
    if(n.id===draggingId){n.vx=0;n.vy=0;continue;}
    const f=forces.get(n.id);
    f.x+=(width/2-n.x)*.0008 + .022*Math.sin(t*.31+n.seed);
    f.y+=(height/2-n.y)*.0008 + .022*Math.cos(t*.29+n.seed);
    n.vx=(n.vx+f.x*dt)*.91;n.vy=(n.vy+f.y*dt)*.91;
    n.x+=Math.max(-3,Math.min(3,n.vx))*dt;
    n.y+=Math.max(-3,Math.min(3,n.vy))*dt;
    const mX=Math.min(width*.36,Math.max(30,n.label.length*3.25+10));
    n.x=Math.max(mX,Math.min(width-mX,n.x));n.y=Math.max(36,Math.min(height-38,n.y));
  }
}

    if(e.type==="research"&&!graphShowResearch||e.type==="interdependency"&&!graphShowInterdep)continue;

const toModelX=(x)=>(x-width/2)/zoom+width/2;
const toModelY=(y)=>(y-height/2)/zoom+height/2;
function hitNode(x,y){
  if(phase!==2)return null;
  let best=null,dist=Infinity;
  for(const n of graph.nodes){
    const d=Math.hypot(n.x-x,n.y-y);
    if(d<Math.max(15, Math.min(32,5+n.label.length*1.6)) && d<dist){best=n;dist=d;}
  }
  return best;
}
function mousePressed(){
  if(phase!==2||mouseX<0||mouseY<0||mouseX>width||mouseY>height)return;
  const target=hitNode(toModelX(mouseX),toModelY(mouseY));

  return false;
}
function mouseDragged(){

function takeData(data,replace){
  const entries=(Array.isArray(data.responses)?data.responses:[]).slice(0,1000).filter(r=>r&&clean(r.object)&&clean(r.author))
    .map(r=>({id:clean(r.id)||uid(),author:clean(r.author),object:clean(r.object),
      depends:distinct(Array.isArray(r.depends)?r.depends:[]),transforms:distinct(Array.isArray(r.transforms)?r.transforms:[]),
      territories:distinct(Array.isArray(r.territories)?r.territories:[]),demo:!!r.demo}));
  const concepts=distinct(Array.isArray(data.extraConcepts)?data.extraConcepts:[]);
  const links=(Array.isArray(data.extraLinks)?data.extraLinks:[]).filter(e=>e&&clean(e.a)&&clean(e.b))
    .map(e=>({id:clean(e.id)||uid(),a:clean(e.a),b:clean(e.b),verb:clean(e.verb)||"est lié à"}));
  if(replace){responses=entries;extraConcepts=concepts;extraLinks=links;}
  else{
    const byId=new Map(responses.map(r=>[r.id,r]));entries.forEach(r=>byId.set(r.id,r));responses=[...byId.values()];
    extraConcepts=distinct([...extraConcepts,...concepts]);
    const byLinkId=new Map(extraLinks.map(e=>[e.id,e]));links.forEach(e=>byLinkId.set(e.id,e));extraLinks=[...byLinkId.values()];
  }
  if(replace){phase=data.phase===2?2:1;graphShowResearch=data.graphShowResearch!==false;
    graphShowInterdep=data.graphShowInterdep!==false;
    motion=typeof data.motion==="number"?Math.max(0,Math.min(1,data.motion)):.7;
    zoom=typeof data.zoom==="number"?Math.max(.65,Math.min(1.65,data.zoom)):1;}
  startedDemo=responses.some(r=>r.demo);
}

  $("formNotice").textContent="DÉMONSTRATION FICTIVE : supprimez les fiches d’exemple avant le véritable atelier.";
}
function clearAll(){
  if(!confirm("Effacer toutes les réponses et relations manuelles dans ce navigateur ? Exportez d’abord un JSON si besoin."))return;
  responses=[];extraConcepts=[];extraLinks=[];startedDemo=false;clearForm();changed();setPhase(1);
}
